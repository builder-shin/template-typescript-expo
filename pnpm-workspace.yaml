# pnpm 11 은 빌드 스크립트가 있는 의존성마다 허용 여부를 명시하게 한다. unrs-resolver
# (eslint-config-expo → eslint-import-resolver-typescript 가 끌어온다)의 postinstall 은 플랫폼
# 네이티브 바인딩이 있는지 확인하고 없을 때만 내려받는 폴백이다. 바인딩은 optionalDependencies 로
# 이미 설치되고 스크립트 없이 로드되므로(2026-09-30 실측) 실행을 허용하지 않는다.
allowBuilds:
  unrs-resolver: false

# engines.node 를 강제한다 — pnpm 11 은 .npmrc 의 engine-strict 를 읽지 않는다.
engineStrict: true

# pnpm 11 은 릴리스 후 1일(minimumReleaseAge, 기본 1440분)이 지나지 않은 버전이 락파일에
# 있으면 설치를 막는다(ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION). 아래는 2026-09-29 에
# 릴리스된 Expo SDK 57 패키지를 2026-09-30 에 설치하며 pnpm 이 스스로 적은 예외다.
# 가장 늦은 릴리스(expo-router 2026-09-29 10:59 UTC)로부터 하루가 지나면 없어도 설치된다.
minimumReleaseAgeExclude:
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo@57.0.26
  - '@expo/ui@57.0.21'
  - expo-router@57.0.24
