# pnpm 11 은 빌드 스크립트가 있는 의존성마다 허용 여부를 명시하게 한다. unrs-resolver
# (eslint-config-expo → eslint-import-resolver-typescript 가 끌어온다)의 postinstall 은 플랫폼
# 네이티브 바인딩이 있는지 확인하고 없을 때만 내려받는 폴백이다. 바인딩은 optionalDependencies 로
# 이미 설치되고 스크립트 없이 로드되므로(2026-09-30 실측) 실행을 허용하지 않는다.
allowBuilds:
  unrs-resolver: false

# engines.node 를 강제한다 — pnpm 11 은 .npmrc 의 engine-strict 를 읽지 않는다.
engineStrict: true

# pnpm 11 은 릴리스 후 1일(minimumReleaseAge, 기본 1440분)이 지나지 않은 버전이 락파일에 있으면
# --frozen-lockfile 설치도 막는다(ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION). 그 창 안의 버전을 설치하면 pnpm 이
# 여기에 minimumReleaseAgeExclude 를 스스로 적는다 - 그대로 두고, 릴리스로부터 하루가 지난 뒤의 다음 의존성
# 변경 때 뺀다(`pnpm view <이름>@<버전> time --json` 으로 릴리스 시각을 본다).

# 웹은 대상이 아니므로(스펙 1.2) expo-router 의 웹 전용 의존성이 요구하는 react-dom 은 설치하지 않는다.
peerDependencyRules:
  ignoreMissing:
    - react-dom

# Windows 에서 Android 네이티브 빌드(Gradle·CMake·ninja)는 isolated 링커의 node_modules/.pnpm 경로를
# 감당하지 못한다. 저장소를 6자 경로에 두어도 isolated 는 실패하고 hoisted 는 성공했다(2026-09-30 실측,
# docs/superpowers/notes/2026-09-30-d1-measurements.md 의 M1 절). hoisted 로도 저장소 경로가 길면 같은
# 빌드가 실패한다(47자까지 성공, 50자에서 실패).
nodeLinker: hoisted

# package.json 의 devDependencies 가 metro·metro-cache·metro-transform-worker 를 0.84.5 로 고정한다.
# Expo 의 번들러(@expo/metro)가 metro 계열을 0.84.5 로 고정해 두었고, uniwind/metro 는 그 metro 의
# Graph 프로토타입을 덮어쓰고 metro-cache 의 FileStore 를 상속한다 - 둘이 같은 인스턴스여야 한다
# (docs/superpowers/notes/2026-09-30-d1-measurements.md 의 M1 절). 고정을 빼면 react-native 의 CLI 가
# 끌어온 0.84.6 이 최상위에 호이스팅될 수 있다. pnpm peers check 는 이 동일성을 보지 않으므로
# test/unit/deps/metro-pin.test.ts 가 잰다.
