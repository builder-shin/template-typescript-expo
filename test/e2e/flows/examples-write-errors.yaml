# e2e-allow-http: 401 404 422
# 쓰기의 실패 처리(스펙 9.1·9.2·11.3):
#   - 필수 칸(제목·점수)을 비워 만들면 422 VALIDATION_ERROR - 그 칸 아래 필드 오류가 뜨고 화면은 그대로다.
#   - 없는 id 의 수정 화면은 not-found 다(상세 조회의 404).
#   - 고치는 사이 자원이 없어졌으면 저장이 404 - not-found 를 그린다.
#   - 지우는 사이 자원이 없어졌으면 삭제의 404 는 이미 이뤄진 결과다 - 목록으로 간다.
#   - 백엔드가 세션을 끊었으면 쓰기 앞의 회전이 401 TOKEN_REVOKED - 기기 세션을 지우고 지금 경로를 next 로
#     실어 로그인으로 보낸다(스펙 7.2·7.3·9.2). 로그인하면 쓰던 화면으로 돌아온다.
# 자원과 세션을 앱 밖에서 없애는 것은 test/e2e/scripts/examples-api.js 의 STEP=delete·revoke 다.
appId: com.example.templateexpo.e2e
---
- runFlow: ../subflows/start-signed-out.yaml
- runScript:
    file: ../scripts/examples-api.js
    env:
      STEP: account
- runFlow: ../subflows/login.yaml
# 422 - 제목과 점수를 비운 채 만든다. 상태는 첫 값이 골라진 채로 시작한다.
- openLink: templateexpo-e2e://examples/new
- extendedWaitUntil:
    visible:
      id: resource-form
    timeout: 20000
- scrollUntilVisible:
    element:
      id: submit-button
    direction: DOWN
- tapOn:
    id: submit-button
- scrollUntilVisible:
    element:
      id: field-error-title
    direction: UP
    timeout: 20000
# 포인터가 있는 오류는 배너가 아니라 그 칸 아래다(스펙 9.1) - 배너는 폼 맨 위에 그린다.
- assertNotVisible:
    id: form-banner
- scrollUntilVisible:
    element:
      id: field-error-score
    direction: DOWN
- assertNotVisible:
    id: field-error-status
- assertVisible:
    id: new-example-screen
# 404 - 없는 id 의 수정 화면.
- openLink: templateexpo-e2e://examples/00000000-0000-4000-8000-00000000d4d4/edit
- extendedWaitUntil:
    visible:
      id: not-found-screen
    timeout: 20000
# 404 - 고치는 사이 없어진 자원을 저장한다.
- runScript:
    file: ../scripts/examples-api.js
    env:
      STEP: example
      TITLE: ${output.prefix} e1
- openLink: templateexpo-e2e://examples/${output.exampleId}/edit
- extendedWaitUntil:
    visible:
      id: field-input-title
      text: ${output.prefix} e1
    timeout: 20000
- runScript:
    file: ../scripts/examples-api.js
    env:
      STEP: delete
- scrollUntilVisible:
    element:
      id: submit-button
    direction: DOWN
# 제출을 빠르게 두 번 누른다 - 저장 요청(PATCH)은 하나여야 한다(이 플로의 api.log 에서 센다 - 다른 단계에는 PATCH 가 없다).
# 404 뒤에 닿은 둘째 누름은 not-found 화면의 빈 자리다.
- tapOn:
    id: submit-button
    repeat: 2
    delay: 1
- extendedWaitUntil:
    visible:
      id: not-found-screen
    timeout: 20000
# 404 - 지우는 사이 이미 없어진 자원을 지운다. 목록으로 간다.
- runScript:
    file: ../scripts/examples-api.js
    env:
      STEP: example
      TITLE: ${output.prefix} e2
- openLink: templateexpo-e2e://examples/${output.exampleId}/edit
- extendedWaitUntil:
    visible:
      id: field-input-title
      text: ${output.prefix} e2
    timeout: 20000
- runScript:
    file: ../scripts/examples-api.js
    env:
      STEP: delete
- scrollUntilVisible:
    element:
      id: delete-button
    direction: DOWN
- tapOn:
    id: delete-button
- extendedWaitUntil:
    visible:
      id: delete-confirm-accept
    timeout: 10000
- tapOn:
    id: delete-confirm-accept
- extendedWaitUntil:
    visible:
      id: examples-screen
    timeout: 20000
# 401 - 백엔드가 이 사용자의 세션을 모두 끊은 뒤 만들기를 누른다. 회전이 거절되고 로그인으로 간다.
- openLink: templateexpo-e2e://examples/new
- extendedWaitUntil:
    visible:
      id: resource-form
    timeout: 20000
- runScript:
    file: ../scripts/examples-api.js
    env:
      STEP: revoke
- tapOn:
    id: field-input-title
- inputText: ${output.prefix} r
- tapOn:
    id: field-label-title
- tapOn:
    id: field-input-score
- inputText: '1'
- tapOn:
    id: field-label-title
- scrollUntilVisible:
    element:
      id: submit-button
    direction: DOWN
- tapOn:
    id: submit-button
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 20000
- assertNotVisible:
    id: logout-button
- runFlow: ../subflows/submit-credentials.yaml
- extendedWaitUntil:
    visible:
      id: resource-form
    timeout: 20000
- assertVisible:
    id: new-example-screen
- assertVisible:
    id: logout-button
