# e2e-allow-http: 404
# 빈 결과와 필터 지우기, 없는 id 의 not-found(스펙 8.1·9.2), 없는 경로(app/+not-found.tsx).
# 없는 id 는 형식이 맞는 UUID 든 틀린 값이든 같은 404 RESOURCE_NOT_FOUND 다.
# not-found 화면은 매번 홈에서 연다 - 상세의 not-found 와 없는 경로의 not-found 는 같은 testID 라, 앞 화면이
# 남아 있으면 다음 단언이 아무것도 재지 않는다.
appId: com.example.templateexpo.e2e
---
- runFlow: ../subflows/start-signed-out.yaml
- openLink: templateexpo-e2e://examples?filter%5Btitle%5D%5Bcontains%5D=probe-d3-nothing-matches
- runFlow: ../subflows/confirm-ios-open-link.yaml
- extendedWaitUntil:
    visible:
      id: list-empty
    timeout: 20000
- assertNotVisible:
    id: resource-row
# 필터 지우기 - 조건 없는 목록이다. 씨앗이 있으므로 행이 보인다.
- tapOn:
    id: empty-clear-filters
- extendedWaitUntil:
    visible:
      id: resource-row
    timeout: 20000
- assertNotVisible:
    id: list-empty
- openLink: templateexpo-e2e://examples/00000000-0000-4000-8000-00000000d3d3
- runFlow: ../subflows/confirm-ios-open-link.yaml
- extendedWaitUntil:
    visible:
      id: not-found-screen
    timeout: 20000
- tapOn:
    id: not-found-home
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- openLink: templateexpo-e2e://examples/probe-not-a-uuid
- runFlow: ../subflows/confirm-ios-open-link.yaml
- extendedWaitUntil:
    visible:
      id: not-found-screen
    timeout: 20000
- tapOn:
    id: not-found-home
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- openLink: templateexpo-e2e://probe-no-such-route
- runFlow: ../subflows/confirm-ios-open-link.yaml
- extendedWaitUntil:
    visible:
      id: not-found-screen
    timeout: 20000
