# e2e-allow-http: 400
# 계약 실험실을 로그인하지 않은 채(스펙 8.6·7.3). 세션이 필요한 셋은 요청하지 않고 로그인 화면으로 가고, 뒤로
# 가면 실험실이다(결과가 생기지 않는다). 나머지 셋은 원본 응답을 그대로 보인다 - 정책에 없는 필터 연산자는
# 400 INVALID_FILTER 의 원본 문서(그 400 을 선언한다), 페이지 총합은 켠 요청의 본문에만 totalCount, offset 순회는
# page[number]=1 에서 links.next 를 끝까지 따라가 두 쪽 이상을 지난다(씨앗 여섯 행, 쪽당 셋 - 이 플로는 이름 순으로
# 목록·쓰기 플로보다 먼저 돈다). 결과의 본문은 길어서 단언할 요소를 먼저 화면에 들인다. 실행을 누른 뒤에는 스피너가
# 멈추기를 기다린 다음(waitForAnimationToEnd) 스크롤한다 - 도는 동안 스크롤하면 결과가 화면 위쪽에 끼어 아래로 찾는
# 스크롤이 지나칠 수 있다.
# 앞머리는 실험실에 드는 두 길이다. 앱을 멈춘 채 딥링크로 곧장 연 실험실은 루트에 혼자라 헤더에 뒤로 가기가 없고
# "홈으로"(로그인 화면과 같은 출구 - iOS 에는 뒤로 가기 키가 없다)가 홈으로 데려간다. 홈의 진입은 빠르게 두 번 눌러도
# 실험실이 하나만 쌓인다(useNavigateOnce) - 뒤로 한 번이면 홈이고, 홈에서 든 실험실에는 "홈으로" 가 없다.
appId: com.example.templateexpo.e2e
---
- runFlow: ../subflows/start-signed-out.yaml
# 딥링크로 곧장 연 실험실 - 앱을 멈춘 채 연다(콜드 스타트). 앱이 떠 있으면 딥링크가 홈 위에 실험실을 쌓아 "홈으로" 가
# 그려지지 않는다.
- stopApp
- openLink: templateexpo-e2e://contract
- extendedWaitUntil:
    visible:
      id: back-to-home-button
    timeout: 30000
- assertVisible:
    id: lab-screen
- tapOn:
    id: back-to-home-button
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
- assertNotVisible:
    id: lab-screen
# 홈의 진입을 빠르게 두 번 누른다(`repeat: 2`) - 실험실이 하나만 쌓였으면 뒤로 한 번에 홈이다. 둘째 누름이 실험실에
# 닿는 자리는 첫 카드(PUT upsert)의 설명 글이라 누를 것이 없다 - 그 카드의 실행 버튼은 그보다 126dp 아래다.
- tapOn:
    id: home-lab-link
    repeat: 2
    delay: 1
- extendedWaitUntil:
    visible:
      id: lab-screen
    timeout: 15000
- assertNotVisible:
    id: back-to-home-button
- runFlow: ../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
- assertNotVisible:
    id: lab-screen
- tapOn:
    id: home-lab-link
- extendedWaitUntil:
    visible:
      id: lab-screen
    timeout: 15000
# 세션이 필요한 셋 - 누르기 전에 안내가 있고, 누르면 로그인 화면이다.
- assertVisible:
    id: lab-session-note-putUpsert
- tapOn:
    id: lab-run-putUpsert
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 15000
- runFlow: ../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: lab-run-putUpsert
    timeout: 15000
- assertNotVisible:
    id: lab-result-putUpsert
- scrollUntilVisible:
    element:
      id: lab-run-relationshipWrite
    direction: DOWN
- assertVisible:
    id: lab-session-note-relationshipWrite
- tapOn:
    id: lab-run-relationshipWrite
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 15000
- runFlow: ../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: lab-run-relationshipWrite
    timeout: 15000
- assertNotVisible:
    id: lab-result-relationshipWrite
- scrollUntilVisible:
    element:
      id: lab-run-acceptLanguage
    direction: DOWN
- assertVisible:
    id: lab-session-note-acceptLanguage
- tapOn:
    id: lab-run-acceptLanguage
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 15000
- runFlow: ../subflows/back.yaml
- extendedWaitUntil:
    visible:
      id: lab-run-acceptLanguage
    timeout: 15000
- assertNotVisible:
    id: lab-result-acceptLanguage
# 정책에 없는 필터 연산자 - 400 과 INVALID_FILTER, 그 source.parameter 가 filter[title][gt] 다.
- scrollUntilVisible:
    element:
      id: lab-run-invalidFilter
    direction: DOWN
- tapOn:
    id: lab-run-invalidFilter
- waitForAnimationToEnd:
    timeout: 20000
- scrollUntilVisible:
    element:
      id: lab-status-invalidFilter
      text: '400'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: lab-body-invalidFilter
      text: '[\s\S]*INVALID_FILTER[\s\S]*'
    direction: DOWN
    visibilityPercentage: 10
- assertVisible:
    id: lab-body-invalidFilter
    text: '[\s\S]*filter\[title\]\[gt\][\s\S]*'
# 페이지 총합 - 끈 요청(0)과 켠 요청(1). 둘 다 200 이고, 켠 요청의 본문에만 totalCount 가 있다. 끈 쪽의 부정
# 단언은 그 본문이 화면에 있을 때만 뜻이 있다 - 먼저 들인다.
- scrollUntilVisible:
    element:
      id: lab-run-pageTotals
    direction: UP
- tapOn:
    id: lab-run-pageTotals
- waitForAnimationToEnd:
    timeout: 20000
- scrollUntilVisible:
    element:
      id: lab-step-heading-pageTotals-0
      text: '.*\(상태 200\)'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: lab-step-body-pageTotals-0
    direction: DOWN
    visibilityPercentage: 10
- assertNotVisible:
    id: lab-step-body-pageTotals-0
    text: '[\s\S]*totalCount[\s\S]*'
- scrollUntilVisible:
    element:
      id: lab-step-heading-pageTotals-1
      text: '.*\(상태 200\)'
    direction: DOWN
- scrollUntilVisible:
    element:
      id: lab-step-body-pageTotals-1
      text: '[\s\S]*totalCount[\s\S]*'
    direction: DOWN
    visibilityPercentage: 10
# offset 순회 - 1쪽·2쪽이 200 이고, 맺음말이 끝에 닿았다고 적는다.
- scrollUntilVisible:
    element:
      id: lab-run-offsetWalk
    direction: UP
- tapOn:
    id: lab-run-offsetWalk
- waitForAnimationToEnd:
    timeout: 20000
- scrollUntilVisible:
    element:
      id: lab-step-heading-offsetWalk-0
      text: '.*\(상태 200\)'
    direction: DOWN
    timeout: 20000
# 아래 두 스크롤은 긴 본문을 조금씩 내려가 D5 의 로컬 에뮬레이터에서도 16.2–17.2초가 걸렸다(세 회차, 제한 30초) - CI 의
# 느린 기기(소프트웨어 렌더링 에뮬레이터, macOS 러너의 시뮬레이터)에 맞춰 90초를 준다. 찾는 요소와 글자는 그대로다.
- scrollUntilVisible:
    element:
      id: lab-step-heading-offsetWalk-1
      text: '.*\(상태 200\)'
    direction: DOWN
    timeout: 90000
- scrollUntilVisible:
    element:
      id: lab-note-offsetWalk
      text: '.*컬렉션 끝에 닿았다.*'
    direction: DOWN
    timeout: 90000
