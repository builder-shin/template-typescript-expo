appId: com.example.templateexpo.e2e
---
# 백엔드가 연결은 받고 응답하지 않을 때 request() 의 15초 타임아웃이 걸리는가.
# 실행하기 전에 API 컨테이너를 docker pause 로 멈춰 둔다.
- launchApp:
    clearState: true
# launchApp 은 JS 가 뜨기 전에 돌아온다 - 그 사이에 보낸 딥링크는 버려진다.
- extendedWaitUntil:
    visible:
      id: home-probe-button
    timeout: 30000
- openLink: templateexpo-e2e://probe
- tapOn:
    id: probe-health
- extendedWaitUntil:
    visible:
      id: probe-health-result
      text: 'fail 0 REQUEST_TIMEOUT'
    timeout: 25000
