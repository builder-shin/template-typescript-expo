appId: com.example.templateexpo.e2e
---
- launchApp:
    clearState: true
# launchApp 은 JS 가 뜨기 전에 돌아온다 - 그 사이에 보낸 딥링크는 버려진다.
- extendedWaitUntil:
    visible:
      id: home-probe-button
    timeout: 30000
- openLink: templateexpo-e2e://probe
- copyTextFrom:
    id: probe-extra
- evalScript: "${console.log('M4 extra: ' + maestro.copiedText)}"
- tapOn:
    id: probe-health
- extendedWaitUntil:
    visible:
      id: probe-health-result
      text: 'ok 200'
    timeout: 20000
