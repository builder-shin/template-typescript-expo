appId: com.example.templateexpo.e2e
---
- launchApp:
    clearState: true
# launchApp 은 JS 가 뜨기 전에 돌아온다 - 그 사이에 보낸 딥링크는 버려진다.
- extendedWaitUntil:
    visible:
      id: home-probe-button
    timeout: 30000
- openLink: templateexpo-e2e://probe
- tapOn:
    id: probe-abort
- extendedWaitUntil:
    visible:
      id: probe-abort-result
      text: '.+ \d+ms'
    timeout: 15000
- copyTextFrom:
    id: probe-abort-result
- evalScript: "${console.log('M6 abort: ' + maestro.copiedText)}"
- assertVisible:
    id: probe-abort-result
    text: 'AbortError \d+ms'
